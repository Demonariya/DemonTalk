<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<title>DemonTalk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">OFFLINE</span>
    </div>
    <div class="status-right">
      <span id="peerCount">0 peers</span>
      <span id="batteryIcon">&#128267;</span>
      <span id="batteryPct">100%</span>
    </div>
  </div>

  <!-- Screen: Radio -->
  <div class="screen active" id="screenRadio">
    <div class="screen-header">
      <div class="header-name" id="deviceName">DemonTalk</div>
      <div class="header-channel" id="channelName">No Channel</div>
    </div>

    <div class="radio-body">
      <!-- Waveform TX -->
      <div class="waveform-container">
        <canvas id="waveformTx" width="360" height="48"></canvas>
      </div>

      <!-- PTT Button -->
      <div class="ptt-area">
        <button class="ptt-btn" id="pttBtn">
          <div class="ptt-glow"></div>
          <div class="ptt-ring"></div>
          <div class="ptt-inner">
            <div class="ptt-icon" id="pttIcon">
              <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            <div class="ptt-label" id="pttLabel">READY</div>
          </div>
        </button>
      </div>

      <!-- Waveform RX -->
      <div class="waveform-container">
        <canvas id="waveformRx" width="360" height="40"></canvas>
      </div>
    </div>

    <!-- Info Row -->
    <div class="info-row">
      <div class="info-tile">
        <svg class="info-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        <span class="info-label">Mic</span>
      </div>
      <div class="info-tile">
        <svg class="info-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4-.91 7-4.49 7-8.78s-3-7.87-7-8.78z"/></svg>
        <span class="info-label">Speaker</span>
      </div>
      <div class="info-tile">
        <svg class="info-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="2" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="4" y="8" width="10" height="8" rx="1" fill="currentColor" opacity="0.8"/><rect x="21" y="9" width="2" height="6" rx="1" fill="currentColor"/></svg>
        <span class="info-label" id="batteryInfo">100%</span>
      </div>
      <div class="info-tile">
        <svg class="info-icon signal" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 4v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="info-label">Signal</span>
      </div>
    </div>

    <button class="emergency-btn" id="emergencyBtn"><svg style="vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg> EMERGENCY</button>
  </div>

  <!-- Screen: Channels -->
  <div class="screen" id="screenChannels">
    <div class="screen-header">
      <div class="header-title">CHANNELS</div>
      <button class="header-action" id="createChannelBtn">+</button>
    </div>
    <div class="scroll-area" id="channelList">
      <div class="empty-state" id="channelEmpty">No channels yet.<br>Create one to get started.</div>
    </div>
  </div>

  <!-- Screen: Chat -->
  <div class="screen" id="screenChat">
    <div class="screen-header">
      <div class="header-title">CHAT</div>
      <div class="header-sub" id="chatChannelLabel">No channel</div>
    </div>
    <div class="chat-messages scroll-area" id="messageList"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
      <button class="send-btn" id="sendBtn">&#9654;</button>
    </div>
  </div>

  <!-- Screen: Devices -->
  <div class="screen" id="screenDevices">
    <div class="screen-header">
      <div class="header-title">DEVICES</div>
      <button class="header-action" id="scanBtn">&#128269; SCAN</button>
    </div>
    <div class="scan-status" id="scanStatus">Ready to scan</div>
    <div class="scroll-area" id="deviceList">
      <div class="empty-state" id="deviceEmpty">No devices found.<br>Tap SCAN to search.</div>
    </div>
  </div>

  <!-- Screen: Settings -->
  <div class="screen" id="screenSettings">
    <div class="screen-header">
      <div class="header-title">SETTINGS</div>
    </div>
    <div class="scroll-area" id="settingsList"></div>
  </div>

  <!-- Create Channel Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-title" id="modalTitle">Create Channel</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Pull to Refresh Indicator -->
  <div class="pull-indicator" id="pullIndicator"><span class="pull-text">Pull to refresh</span></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-screen="Radio">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
      <span class="nav-label">Radio</span>
    </button>
    <button class="nav-btn" data-screen="Channels">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
      <span class="nav-label">Channels</span>
    </button>
    <button class="nav-btn" data-screen="Chat">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label">Chat</span>
    </button>
    <button class="nav-btn" data-screen="Devices">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <span class="nav-label">Devices</span>
    </button>
    <button class="nav-btn" data-screen="Settings">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>

<script src="js/bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
