<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<title>DemonTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">OFFLINE</span>
    </div>
    <div class="status-right">
      <span id="peerCount">0 peers</span>
      <span id="batteryIcon">&#128267;</span>
      <span id="batteryPct">100%</span>
    </div>
  </div>

  <!-- Screen: Radio -->
  <div class="screen active" id="screenRadio">
    <div class="screen-header">
      <div class="header-name" id="deviceName">DemonTalk</div>
      <div class="header-channel" id="channelName">No Channel</div>
    </div>

    <div class="radio-body">
      <!-- Waveform TX -->
      <div class="waveform-container">
        <canvas id="waveformTx" width="360" height="48"></canvas>
      </div>

      <!-- PTT Button -->
      <div class="ptt-area">
        <button class="ptt-btn" id="pttBtn">
          <div class="ptt-glow"></div>
          <div class="ptt-ring"></div>
          <div class="ptt-inner">
            <div class="ptt-icon material-symbols-outlined" id="pttIcon">mic</div>
            <div class="ptt-label" id="pttLabel">READY</div>
          </div>
        </button>
      </div>

      <!-- Waveform RX -->
      <div class="waveform-container">
        <canvas id="waveformRx" width="360" height="40"></canvas>
      </div>
    </div>

    <!-- Info Row -->
    <div class="info-row">
      <div class="info-tile">
        <span class="info-icon material-symbols-outlined" id="micIcon">mic</span>
        <span class="info-label">Mic</span>
      </div>
      <div class="info-tile">
        <span class="info-icon material-symbols-outlined" id="speakerIcon">volume_up</span>
        <span class="info-label">Speaker</span>
      </div>
      <div class="info-tile">
        <span class="info-icon material-symbols-outlined" id="batteryInfoIcon">battery_5_bar</span>
        <span class="info-label" id="batteryInfo">100%</span>
      </div>
      <div class="info-tile">
        <span class="info-icon material-symbols-outlined signal" id="signalBars">signal_cellular_alt</span>
        <span class="info-label">Signal</span>
      </div>
    </div>

    <button class="emergency-btn" id="emergencyBtn"><span class="material-symbols-outlined" style="vertical-align:middle">warning</span> EMERGENCY</button>
  </div>

  <!-- Screen: Channels -->
  <div class="screen" id="screenChannels">
    <div class="screen-header">
      <div class="header-title">CHANNELS</div>
      <button class="header-action" id="createChannelBtn">+</button>
    </div>
    <div class="scroll-area" id="channelList">
      <div class="empty-state" id="channelEmpty">No channels yet.<br>Create one to get started.</div>
    </div>
  </div>

  <!-- Screen: Chat -->
  <div class="screen" id="screenChat">
    <div class="screen-header">
      <div class="header-title">CHAT</div>
      <div class="header-sub" id="chatChannelLabel">No channel</div>
    </div>
    <div class="chat-messages scroll-area" id="messageList"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
      <button class="send-btn" id="sendBtn">&#9654;</button>
    </div>
  </div>

  <!-- Screen: Devices -->
  <div class="screen" id="screenDevices">
    <div class="screen-header">
      <div class="header-title">DEVICES</div>
      <button class="header-action" id="scanBtn">&#128269; SCAN</button>
    </div>
    <div class="scan-status" id="scanStatus">Ready to scan</div>
    <div class="scroll-area" id="deviceList">
      <div class="empty-state" id="deviceEmpty">No devices found.<br>Tap SCAN to search.</div>
    </div>
  </div>

  <!-- Screen: Settings -->
  <div class="screen" id="screenSettings">
    <div class="screen-header">
      <div class="header-title">SETTINGS</div>
    </div>
    <div class="scroll-area" id="settingsList"></div>
  </div>

  <!-- Create Channel Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-title" id="modalTitle">Create Channel</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Pull to Refresh Indicator -->
  <div class="pull-indicator" id="pullIndicator"><span class="pull-text">Pull to refresh</span></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-screen="Radio">
      <span class="nav-icon material-symbols-outlined">settings_input_antenna</span>
      <span class="nav-label">Radio</span>
    </button>
    <button class="nav-btn" data-screen="Channels">
      <span class="nav-icon material-symbols-outlined">cell_tower</span>
      <span class="nav-label">Channels</span>
    </button>
    <button class="nav-btn" data-screen="Chat">
      <span class="nav-icon material-symbols-outlined">mark_chat_unread</span>
      <span class="nav-label">Chat</span>
    </button>
    <button class="nav-btn" data-screen="Devices">
      <span class="nav-icon material-symbols-outlined">radar</span>
      <span class="nav-label">Devices</span>
    </button>
    <button class="nav-btn" data-screen="Settings">
      <span class="nav-icon material-symbols-outlined">tune</span>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>

<script src="js/bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
